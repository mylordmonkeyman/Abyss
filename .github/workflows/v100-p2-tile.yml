name: V100 P2 isolated attention tile
on:
  workflow_dispatch:
  push:
    branches: [feature/deepseek-v100-p1]
    paths:
      - '.github/workflows/v100-p2-tile.yml'
      - 'tests/v100/attention_tile.cuh'
      - 'tests/v100/test_dsv4_attention_tile.cu'
      - 'tools/profiling/p2_attention_bench.py'
permissions:
  contents: read
concurrency:
  group: abyss-v100
  cancel-in-progress: false
jobs:
  attention:
    if: >-
      github.repository == 'mylordmonkeyman/Abyss' &&
      github.actor == 'mylordmonkeyman' &&
      github.triggering_actor == 'mylordmonkeyman' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/feature/deepseek-v100-p1'
    runs-on: [self-hosted, Linux, X64, v100, sm70, cuda-12-8]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      NVCC: /usr/local/cuda-12.8/bin/nvcc
      ABYSS_GPU: '0'
      STRATA_DS4_IDX: '1'
      STRATA_DS4_ATTN: '1'
      EVIDENCE: results/ci-v100-p2-tile-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: false
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ggml-org/llama.cpp
          ref: 3cf03257f219afbe7334045ff7c6a06ac68c627d
          path: third_party/llama.cpp
          persist-credentials: false
      - name: Build isolated tile without replacing engine binaries
        run: |
          set -euo pipefail
          identity=$(nvidia-smi -i "$ABYSS_GPU" --query-gpu=uuid,compute_cap --format=csv,noheader)
          [[ "$identity" == *,\ 7.0 ]]
          echo "CUDA_VISIBLE_DEVICES=${identity%%,*}" >> "$GITHUB_ENV"
          echo "$(dirname "$NVCC")" >> "$GITHUB_PATH"
          test -z "$(nvidia-smi -i "$ABYSS_GPU" --query-compute-apps=pid --format=csv,noheader)"
          mkdir -p "$EVIDENCE"
          git rev-parse HEAD > "$EVIDENCE/source-sha.txt"
          cmake --preset v100-diagnostics -B build-v100-p2-feasibility -DCMAKE_CUDA_COMPILER="$NVCC" \
            -DSTRATA_GGML_DIR="$GITHUB_WORKSPACE/third_party/llama.cpp" -DSTRATA_V100_TESTS=ON \
            -DSTRATA_V100_CAPTURE_STAGES=OFF -DSTRATA_V100_CAPTURE_INDEXER=OFF 2>&1 | tee "$EVIDENCE/configure.log"
          cmake --build build-v100-p2-feasibility --target test_dsv4_attention_tile --parallel 32 2>&1 | tee "$EVIDENCE/build.log"
          sha256sum build-v100-p2-feasibility/test_dsv4_attention_tile > "$EVIDENCE/binary-sha256.txt"
      - name: Numerical, gather, guard, nondefault-stream graph parity
        run: build-v100-p2-feasibility/test_dsv4_attention_tile > "$EVIDENCE/parity.jsonl"
      - name: Memcheck and synccheck
        run: |
          set -euo pipefail
          compute-sanitizer --tool memcheck --error-exitcode 1 build-v100-p2-feasibility/test_dsv4_attention_tile > "$EVIDENCE/memcheck.log" 2>&1
          compute-sanitizer --tool synccheck --error-exitcode 1 build-v100-p2-feasibility/test_dsv4_attention_tile > "$EVIDENCE/synccheck.log" 2>&1
      - name: Six interleaved timing pairs per matched raw CSA HCA shape
        run: /actions-runner/abyss-v100-python/bin/python tools/profiling/p2_attention_bench.py
      - name: Enforce bounded diagnostic artifact
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib
          root=pathlib.Path(os.environ['EVIDENCE']);files=list(root.rglob('*'))
          assert not any(p.is_symlink() for p in files)
          assert sum(p.stat().st_size for p in files if p.is_file())<=64*1024**2
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('P2_TILE_CAP=true\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.P2_TILE_CAP == 'true'
        with:
          name: abyss-p2-tile-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}/
          retention-days: 30
