name: V100 P1 clean four-indexer end-to-end comparison
on:
  workflow_dispatch:
  push:
    branches: [feature/deepseek-v100-p1]
    paths:
      - '.github/workflows/v100-p1-indexer-clean.yml'
      - 'tools/profiling/p1_indexer_clean.py'
permissions:
  contents: read
concurrency:
  group: abyss-v100
  cancel-in-progress: false
env:
  NVCC: /usr/local/cuda-12.8/bin/nvcc
  ABYSS_GPU: '0'
jobs:
  bridge:
    if: >-
      github.repository == 'mylordmonkeyman/Abyss' &&
      github.actor == 'mylordmonkeyman' &&
      github.triggering_actor == 'mylordmonkeyman' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/feature/deepseek-v100-p1'
    runs-on: [self-hosted, Linux, X64, v100, sm70, cuda-12-8]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      EVIDENCE: results/ci-v100-p1-indexer-clean-${{ github.run_id }}-${{ github.run_attempt }}-bridge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: false
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ggml-org/llama.cpp
          ref: 3cf03257f219afbe7334045ff7c6a06ac68c627d
          path: third_party/llama.cpp
          persist-credentials: false
      - name: Test deferred gates before GPU work
        run: /actions-runner/abyss-v100-python/bin/python tools/test_v100_indexer_clean.py
      - name: Validate verified model evidence, source and idle SM70
        run: |
          set -euo pipefail
          /actions-runner/abyss-v100-python/bin/python - <<'PY'
          import json,sys
          sys.path.insert(0,'tools/profiling')
          from p1_indexer_clean import QUALITY,qualified,source_check
          evidence=qualified(json.loads(QUALITY.read_text()))
          source_check(evidence)
          PY
          identity=$(nvidia-smi -i "$ABYSS_GPU" --query-gpu=uuid,compute_cap --format=csv,noheader)
          [[ "$identity" == *,\ 7.0 ]]
          echo "CUDA_VISIBLE_DEVICES=${identity%%,*}" >> "$GITHUB_ENV"
          echo "$(dirname "$NVCC")" >> "$GITHUB_PATH"
          test -z "$(nvidia-smi -i "$ABYSS_GPU" --query-compute-apps=pid --format=csv,noheader)"
          mkdir -p "$EVIDENCE"
          git rev-parse HEAD > "$EVIDENCE/source-sha.txt"
      - name: Build Release SM70 without capture instrumentation
        run: |
          set -euo pipefail
          cmake --preset v100-diagnostics -B build-v100-p1-indexer-clean -DCMAKE_CUDA_COMPILER="$NVCC" \
            -DSTRATA_GGML_DIR="$GITHUB_WORKSPACE/third_party/llama.cpp" -DSTRATA_V100_TESTS=OFF \
            -DSTRATA_V100_CAPTURE_STAGES=OFF -DSTRATA_V100_CAPTURE_INDEXER=OFF -DSTRATA_V100_CAPTURE_COST=OFF 2>&1 | tee "$EVIDENCE/configure.log"
          cmake --build build-v100-p1-indexer-clean --target strata --parallel 32 2>&1 | tee "$EVIDENCE/build.log"
          sha256sum build-v100-p1-indexer-clean/strata > "$EVIDENCE/binary-sha256.txt"
          cuobjdump --list-elf build-v100-p1-indexer-clean/strata > "$EVIDENCE/object-images.txt"
          grep -q sm_70 "$EVIDENCE/object-images.txt"
      - name: Collect nine clean logit arms and deferred gate results
        run: /actions-runner/abyss-v100-python/bin/python tools/profiling/p1_indexer_clean.py --bridge
      - name: Bound bridge evidence
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib
          root=pathlib.Path(os.environ['EVIDENCE'])
          assert not any(p.is_symlink() for p in root.rglob('*'))
          assert sum(p.stat().st_size for p in root.rglob('*') if p.is_file())<=64*1024**2
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('CLEAN_CAP=true\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.CLEAN_CAP == 'true'
        with:
          name: abyss-p1-indexer-clean-bridge-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}/
          retention-days: 30
  timing:
    needs: bridge
    if: >-
      github.repository == 'mylordmonkeyman/Abyss' &&
      github.actor == 'mylordmonkeyman' &&
      github.triggering_actor == 'mylordmonkeyman' &&
      github.ref == 'refs/heads/feature/deepseek-v100-p1'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        block: [0, 1, 2, 3]
    runs-on: [self-hosted, Linux, X64, v100, sm70, cuda-12-8]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      EVIDENCE: results/ci-v100-p1-indexer-clean-${{ github.run_id }}-${{ github.run_attempt }}-block-${{ matrix.block }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: false
          persist-credentials: false
          fetch-depth: 0
      - name: Select idle SM70 and record source
        run: |
          set -euo pipefail
          identity=$(nvidia-smi -i "$ABYSS_GPU" --query-gpu=uuid,compute_cap --format=csv,noheader)
          [[ "$identity" == *,\ 7.0 ]]
          echo "CUDA_VISIBLE_DEVICES=${identity%%,*}" >> "$GITHUB_ENV"
          test -z "$(nvidia-smi -i "$ABYSS_GPU" --query-compute-apps=pid --format=csv,noheader)"
          mkdir -p "$EVIDENCE"
          git rev-parse HEAD > "$EVIDENCE/source-sha.txt"
      - name: Time four immutable-binary modes at 8K 100K and 128K with telemetry
        run: /actions-runner/abyss-v100-python/bin/python tools/profiling/p1_indexer_clean.py --block ${{ matrix.block }}
      - name: Bound timing block evidence
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib
          root=pathlib.Path(os.environ['EVIDENCE'])
          assert not any(p.is_symlink() for p in root.rglob('*'))
          assert sum(p.stat().st_size for p in root.rglob('*') if p.is_file())<=64*1024**2
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('CLEAN_CAP=true\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.CLEAN_CAP == 'true'
        with:
          name: abyss-p1-indexer-clean-block-${{ matrix.block }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}/
          retention-days: 30

  assessment:
    needs: [bridge, timing]
    if: >-
      always() &&
      github.repository == 'mylordmonkeyman/Abyss' &&
      github.actor == 'mylordmonkeyman' &&
      github.triggering_actor == 'mylordmonkeyman' &&
      github.ref == 'refs/heads/feature/deepseek-v100-p1'
    runs-on: [self-hosted, Linux, X64, v100, sm70, cuda-12-8]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      EVIDENCE: results/ci-v100-p1-indexer-clean-${{ github.run_id }}-${{ github.run_attempt }}-assessment
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: false
          persist-credentials: false
          fetch-depth: 0
      - name: Assess gates after all independent measurements
        run: |
          set -euo pipefail
          identity=$(nvidia-smi -i "$ABYSS_GPU" --query-gpu=uuid,compute_cap --format=csv,noheader)
          [[ "$identity" == *,\ 7.0 ]]
          export CUDA_VISIBLE_DEVICES="${identity%%,*}"
          /actions-runner/abyss-v100-python/bin/python tools/profiling/p1_indexer_clean.py --assess
      - name: Bound final assessment evidence
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib
          root=pathlib.Path(os.environ['EVIDENCE'])
          assert root.is_dir()
          assert not any(p.is_symlink() for p in root.rglob('*'))
          assert sum(p.stat().st_size for p in root.rglob('*') if p.is_file())<=64*1024**2
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('CLEAN_CAP=true\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.CLEAN_CAP == 'true'
        with:
          name: abyss-p1-indexer-clean-assessment-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}/
          retention-days: 30
