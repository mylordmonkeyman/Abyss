name: V100 P1 four-indexer model quality comparison
on:
  workflow_dispatch:
  push:
    branches: [feature/deepseek-v100-p1]
    paths:
      - '.github/workflows/v100-p1-indexer-head-to-head.yml'
      - 'tools/profiling/p1_indexer_head_to_head.py'
permissions:
  contents: read
concurrency:
  group: abyss-v100
  cancel-in-progress: false
jobs:
  model:
    if: >-
      github.repository == 'mylordmonkeyman/Abyss' &&
      github.actor == 'mylordmonkeyman' &&
      github.triggering_actor == 'mylordmonkeyman' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/feature/deepseek-v100-p1'
    runs-on: [self-hosted, Linux, X64, v100, sm70, cuda-12-8]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      NVCC: /usr/local/cuda-12.8/bin/nvcc
      ABYSS_GPU: '0'
      EVIDENCE: results/ci-v100-p1-indexer-head-to-head-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: false
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ggml-org/llama.cpp
          ref: 3cf03257f219afbe7334045ff7c6a06ac68c627d
          path: third_party/llama.cpp
          persist-credentials: false
      - name: Require component evidence and build shared model/alias test
        run: |
          set -euo pipefail
          /actions-runner/abyss-v100-python/bin/python - <<'PY'
          import json,pathlib,subprocess
          r=json.loads(pathlib.Path('docs/v100/p1-cublas-corrections-2026-10-20.json').read_text())
          assert r['run']==39471901764
          assert len(r['component_cases'])==140 and len(r['timings'])==105
          rows=[x for x in r['timings'] if x['variant']=='band-all' and x['T']==2048 and x['p0'] in (98304,120000)]
          assert len(rows)==2 and all(x['median_elapsed_change_percent']<0 for x in rows)
          subprocess.run(['git','diff','--exit-code',r['source_sha'],'--','src/kernels/cuda/dsv4_cublas_corrected.cuh','src/kernels/cuda/dsv4_cublas_idx.cuh','src/kernels/cuda/dsv4_volta_idx_refine.cuh','src/kernels/cuda/dsv4_volta_idx_runner.cuh'],check=True)
          PY
          identity=$(nvidia-smi -i "$ABYSS_GPU" --query-gpu=uuid,compute_cap --format=csv,noheader)
          [[ "$identity" == *,\ 7.0 ]]
          echo "CUDA_VISIBLE_DEVICES=${identity%%,*}" >> "$GITHUB_ENV"
          echo "$(dirname "$NVCC")" >> "$GITHUB_PATH"
          test -z "$(nvidia-smi -i "$ABYSS_GPU" --query-compute-apps=pid --format=csv,noheader)"
          mkdir -p "$EVIDENCE"
          git rev-parse HEAD > "$EVIDENCE/source-sha.txt"
          cmake --preset v100-diagnostics -B build-v100-p1-indexer-head-to-head -DCMAKE_CUDA_COMPILER="$NVCC" \
            -DSTRATA_GGML_DIR="$GITHUB_WORKSPACE/third_party/llama.cpp" -DSTRATA_V100_TESTS=ON \
            -DSTRATA_V100_CAPTURE_STAGES=OFF -DSTRATA_V100_CAPTURE_INDEXER=ON -DSTRATA_V100_CAPTURE_COST=OFF 2>&1 | tee "$EVIDENCE/configure.log"
          cmake --build build-v100-p1-indexer-head-to-head --target strata test_dsv4_cublas_model_alias --parallel 32 2>&1 | tee "$EVIDENCE/build.log"
          sha256sum build-v100-p1-indexer-head-to-head/strata > "$EVIDENCE/binary-sha256.txt"
      - name: Validate actual alias lifetimes, correction order, graphs and sanitizers
        run: |
          set -euo pipefail
          STRATA_DS4_IDX=1 timeout 600s build-v100-p1-indexer-head-to-head/test_dsv4_cublas_model_alias 2>&1 | tee "$EVIDENCE/alias-parity.jsonl"
          for tool in memcheck synccheck; do
            STRATA_DS4_IDX=1 timeout 900s compute-sanitizer --tool "$tool" --error-exitcode 1 \
              build-v100-p1-indexer-head-to-head/test_dsv4_cublas_model_alias 2>&1 | tee "$EVIDENCE/alias-$tool.log"
          done
      - name: Balanced four-indexer repeats at frozen 100K and full 128K
        run: /actions-runner/abyss-v100-python/bin/python tools/profiling/p1_indexer_head_to_head.py
      - name: Enforce per-capture and summary artifact bounds
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib
          root=pathlib.Path(os.environ['EVIDENCE'])
          assert not any(p.is_symlink() for p in root.rglob('*'))
          for geometry in ('100k','128k'):
              for mode in ('cublas','corrected','volta'):
                  path=root/'captures'/geometry/mode
                  assert sum(p.stat().st_size for p in path.rglob('*') if p.is_file())<=64*1024**2
          assert sum(p.stat().st_size for p in root.rglob('*') if p.is_file() and 'captures' not in p.relative_to(root).parts)<=64*1024**2
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('H2H_CAP=true\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.H2H_CAP == 'true'
        with:
          name: abyss-p1-indexer-head-to-head-${{ github.run_id }}
          path: |
            ${{ env.EVIDENCE }}/
            !${{ env.EVIDENCE }}/captures/**
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.H2H_CAP == 'true'
        with:
          name: abyss-p1-indexer-cublas-100k-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}/captures/100k/cublas/
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.H2H_CAP == 'true'
        with:
          name: abyss-p1-indexer-corrected-100k-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}/captures/100k/corrected/
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.H2H_CAP == 'true'
        with:
          name: abyss-p1-indexer-volta-100k-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}/captures/100k/volta/
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.H2H_CAP == 'true'
        with:
          name: abyss-p1-indexer-cublas-128k-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}/captures/128k/cublas/
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.H2H_CAP == 'true'
        with:
          name: abyss-p1-indexer-corrected-128k-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}/captures/128k/corrected/
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.H2H_CAP == 'true'
        with:
          name: abyss-p1-indexer-volta-128k-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}/captures/128k/volta/
          retention-days: 30
