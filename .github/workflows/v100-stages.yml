name: V100 real model stage capture

on:
  workflow_dispatch:
  push:
    branches: [feature/deepseek-v100-perf]
    paths:
      - '.github/workflows/v100-stages.yml'
      - 'tools/v100/real_stage_capture.py'
      - 'src/core/v100_stage_capture.hpp'
      - 'tests/v100/real_stage_replay.cuh'

permissions:
  contents: read

concurrency:
  group: abyss-v100
  cancel-in-progress: false

jobs:
  stages:
    if: >-
      github.repository == 'mylordmonkeyman/Abyss' &&
      github.actor == 'mylordmonkeyman' &&
      github.triggering_actor == 'mylordmonkeyman' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/feature/deepseek-v100-perf'
    runs-on: [self-hosted, Linux, X64, v100, sm70, cuda-12-8]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      NVCC: /usr/local/cuda-12.8/bin/nvcc
      BUILD_JOBS: '32'
      ABYSS_GPU: '0'
      EVIDENCE: results/ci-v100-stages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out trusted branch without replacing caches
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: false
          persist-credentials: false
      - name: Check out pinned GGML
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ggml-org/llama.cpp
          ref: 3cf03257f219afbe7334045ff7c6a06ac68c627d
          path: third_party/llama.cpp
          persist-credentials: false
      - name: Select V100 and build compile-only capture diagnostic
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          identity=$(nvidia-smi -i "$ABYSS_GPU" --query-gpu=uuid,compute_cap --format=csv,noheader)
          [[ "$identity" == *,\ 7.0 ]]
          echo "CUDA_VISIBLE_DEVICES=${identity%%,*}" >> "$GITHUB_ENV"
          echo "$(dirname "$NVCC")" >> "$GITHUB_PATH"
          cmake --preset v100-diagnostics -DCMAKE_CUDA_COMPILER="$NVCC" \
            -DSTRATA_GGML_DIR="$GITHUB_WORKSPACE/third_party/llama.cpp" \
            -DSTRATA_V100_TESTS=ON -DSTRATA_V100_CAPTURE_STAGES=ON
          cmake --build build-v100-diagnostics --target strata test_dsv4_mla_latent_parity --parallel "$BUILD_JOBS" \
            2>&1 | tee "$EVIDENCE/build.log"
          cp build-v100-diagnostics/CMakeCache.txt "$EVIDENCE/capture-CMakeCache.txt"
          git rev-parse HEAD > "$EVIDENCE/build-sha.txt"
      - name: Capture actual model activations and replay all three ratios
        run: /actions-runner/abyss-v100-python/bin/python tools/v100/real_stage_capture.py
      - name: Restore normal engine cache without capture code
        if: always()
        run: |
          set -euo pipefail
          cmake --preset v100-diagnostics -DCMAKE_CUDA_COMPILER="$NVCC" \
            -DSTRATA_GGML_DIR="$GITHUB_WORKSPACE/third_party/llama.cpp" \
            -DSTRATA_V100_TESTS=ON -DSTRATA_V100_CAPTURE_STAGES=OFF
          cmake --build build-v100-diagnostics --target strata --parallel "$BUILD_JOBS"
      - name: Check evidence cap
        id: cap
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib
          total=sum(p.stat().st_size for p in pathlib.Path(os.environ['EVIDENCE']).rglob('*') if p.is_file())
          print('Evidence bytes:',total)
          if total>64*1024*1024: raise SystemExit('Evidence exceeds 64 MiB cap')
          PY
      - name: Upload bounded stages and results
        if: always() && steps.cap.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abyss-v100-stages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: warn
          retention-days: 30
