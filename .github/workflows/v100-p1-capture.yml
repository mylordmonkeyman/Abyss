name: V100 P1 late-128K same-input drift diagnostic
on:
  workflow_dispatch:
  push:
    branches: [feature/deepseek-v100-p1]
    paths:
      - '.github/workflows/v100-p1-capture.yml'
      - 'src/core/v100_indexer_capture.hpp'
      - 'tools/profiling/p1_live_capture.py'
permissions:
  contents: read
concurrency:
  group: abyss-v100
  cancel-in-progress: false
jobs:
  quality:
    if: >-
      github.repository == 'mylordmonkeyman/Abyss' &&
      github.actor == 'mylordmonkeyman' &&
      github.triggering_actor == 'mylordmonkeyman' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/feature/deepseek-v100-p1'
    runs-on: [self-hosted, Linux, X64, v100, sm70, cuda-12-8]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      NVCC: /usr/local/cuda-12.8/bin/nvcc
      ABYSS_GPU: '0'
      EVIDENCE: results/ci-v100-p1-capture-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: false
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ggml-org/llama.cpp
          ref: 3cf03257f219afbe7334045ff7c6a06ac68c627d
          path: third_party/llama.cpp
          persist-credentials: false
      - name: Check base and idle V100, build dedicated capture engine
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7c893ac17e61ec45c934b3278356807fc4626c3c HEAD
          test "$(cat VERSION)" = '1.3.31'
          identity=$(nvidia-smi -i "$ABYSS_GPU" --query-gpu=uuid,compute_cap --format=csv,noheader)
          [[ "$identity" == *,\ 7.0 ]]
          echo "CUDA_VISIBLE_DEVICES=${identity%%,*}" >> "$GITHUB_ENV"
          test -z "$(nvidia-smi -i "$ABYSS_GPU" --query-compute-apps=pid --format=csv,noheader)"
          export PATH="$(dirname "$NVCC"):$PATH"
          mkdir -p "$EVIDENCE"
          git rev-parse HEAD > "$EVIDENCE/source-sha.txt"
          "$NVCC" --version > "$EVIDENCE/nvcc.txt"
          nvidia-smi -i "$ABYSS_GPU" -q -x > "$EVIDENCE/initial-gpu.xml"
          cmake --preset v100-diagnostics -B build-v100-p1-capture -DCMAKE_CUDA_COMPILER="$NVCC" \
            -DSTRATA_GGML_DIR="$GITHUB_WORKSPACE/third_party/llama.cpp" \
            -DSTRATA_V100_TESTS=ON -DSTRATA_V100_CAPTURE_STAGES=OFF -DSTRATA_V100_CAPTURE_INDEXER=ON 2>&1 | tee "$EVIDENCE/configure.log"
          cmake --build build-v100-p1-capture --target strata --parallel 32 2>&1 | tee "$EVIDENCE/build.log"
          sha256sum build-v100-p1-capture/strata > "$EVIDENCE/binary-sha256.txt"
      - name: Compare same-input scores, selection, attention and model logits
        run: /actions-runner/abyss-v100-python/bin/python tools/profiling/p1_live_capture.py --geometry 128k --cpu-lane 0 --capture-position 118784
      - name: Enforce bounded diagnostic artifact
        if: always()
        run: |
          python3 - <<'PYCODE'
          import os,pathlib
          root=pathlib.Path(os.environ['EVIDENCE']);files=list(root.rglob('*'))
          assert not any(p.is_symlink() for p in files)
          assert sum(p.stat().st_size for p in files if p.is_file())<=64*1024**2
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('P1_CAPTURE_CAP=true\n')
          PYCODE
      - name: Upload bounded same-input tensors, logits summary and telemetry
        if: always() && env.P1_CAPTURE_CAP == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abyss-p1-capture-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}/
          retention-days: 30
