# Every push and pull request: the Python tests (server, installer, tools) and the AMD build's CUDA-name check - no GPU
# needed. The engine's CUDA build and its GPU tests run on the maintainers' V100s before a merge (CONTRIBUTING.md).
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # llama.cpp's gguf-py at the commit the installer pins (setup.py LLAMA_CPP_COMMIT), where tools/_paths.py looks
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ggml-org/llama.cpp
          ref: 3cf03257f219afbe7334045ff7c6a06ac68c627d
          path: third_party/llama.cpp
          sparse-checkout: gguf-py
      - name: Check the hosted image Python
        run: python3 -c 'import sys; assert sys.version_info >= (3, 12), sys.version'
      # a venv, as installs run: abyss.py started from a system Python hands itself to ./abyss.sh (os.execve)
      - name: Python packages
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet numpy jinja2 regex pyyaml tqdm psutil
      - name: The AMD build's CUDA names all mapped (include/strata/hip_compat)
        run: '"$RUNNER_TEMP/venv/bin/python" tools/check_hip_compat.py'
      - name: Server tests
        run: '"$RUNNER_TEMP/venv/bin/python" -m unittest discover -s serve -p "test_*.py" -t .'
      - name: Installer and tools tests
        run: '"$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tools -p "test_*.py"'

  p0-cpu-build:
    # This is host-tool/build validation, not SM70 compilation or a V100 correctness claim.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate V100 preset syntax
        run: cmake --list-presets
      - name: Configure without CUDA or downloaded GGML
        run: cmake -S . -B build-p0-cpu -DSTRATA_ENABLE_CUDA=OFF -DSTRATA_NATIVE_EXPERTS=OFF -DSTRATA_BUILD_TESTS=OFF
      - name: Build host targets
        run: cmake --build build-p0-cpu --parallel 2
